<!DOCTYPE html>
<html>
<head>
    <title>Click Event</title>
</head>
<body>

<button id="myButton">Click Me</button>

<script>
    // Select the button
    var btn = document.getElementById("myButton");

    // Add click event listener
    btn.addEventListener("click", function() {
        alert("Button was clicked!");
    });
</script>

</body>
</html>
