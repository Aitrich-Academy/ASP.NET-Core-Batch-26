<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const number = parseInt(prompt("Enter a number:"));
if (number % 3 === 0 && number % 5 === 0) {
    document.write(`${number} is divisible by both 3 and 5`);
} else if (number % 3 === 0) {
    document.write(`${number} is only divisible by 3`);
} else if (number % 5 === 0) {
    document.write(`${number} is only divisible by 5`);
} else {
    document.write(`${number} is not divisible by 3 or 5`);
}
    </script>
    
</body>
</html>
