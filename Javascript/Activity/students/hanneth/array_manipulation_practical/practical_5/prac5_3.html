<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.	Check if the number 18 exists in the array using includes.</title>
</head>
<body>
    <script> 
    let nums=[11,12,13,14,15,16,17,18,19];
        document.write(nums,"<br>");
        let index=nums.includes(18);
        document.write(index);
    </script>
</body>
</html>
