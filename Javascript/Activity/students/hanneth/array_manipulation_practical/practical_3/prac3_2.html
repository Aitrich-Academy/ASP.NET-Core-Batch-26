<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.	Extract the first three names using slice without modifying the original array.</title>
</head>
<body>
    <script>
        let names=["Alice","Bob","Charlie","Diana","Eve"];
        document.write(names + "<br>");
        document.write("After slice<br>");
       let name= names.slice(0,3);
       document.write(name);
    </script>
</body>
</html>
