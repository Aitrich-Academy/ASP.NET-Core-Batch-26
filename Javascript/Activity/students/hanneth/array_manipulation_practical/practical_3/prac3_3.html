<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.	Using splice, remove the last two names from the original array and store them in a new array.</title>
</head>
<body>
    <script>
        let names=["Alice","Bob","Charlie","Diana","Eve"];
        document.write(names + "<br>");
        document.write("After splice <br>");
        let result=names.splice(3,2);
        document.write(result);
    </script>
</body>
</html>
