<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.	Reverse the combined array and print the result.</title>
</head>
<body>
    <script>
        let color1=["red ","green ","blue "];
        let color2=["yellow ","pink ","purple "];
        document.write(color1,"<br>");
        document.write(color2,"<br>");
        let colors=color1.concat(color2);
        document.write(colors,"<br>");
        document.writeln("<b>After reversing</b><br>");
        colors.reverse();
        document.write(colors);
    </script>
</body>
</html>
