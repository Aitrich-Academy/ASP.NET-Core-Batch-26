<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.	Create two arrays of colors (e.g., ["red", "green", "blue"] and ["yellow", "pink", "purple"]).</title>
</head>
<body>
    <script>
        let color1=["red","green","blue"];
        let color2=["yellow","pink","purple"];
        document.writeln(color1,"<br>");
        document.write(color2);
    </script>
</body>
