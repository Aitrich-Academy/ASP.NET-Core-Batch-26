<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.	Combine both arrays into one.</title>
</head>
<body>
    <script>
        let color1=["red ","green ","blue "];
        let color2=["yellow ","pink ","purple "];
        document.write(color1,"<br>");
        document.write(color2,"<br>");
        let colors=color1.concat(color2);
        document.write(colors);
    </script>
</body>
</html>
