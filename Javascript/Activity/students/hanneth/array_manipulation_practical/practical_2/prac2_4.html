<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.	Replace the second and third fruits with new ones using splice.</title>
</head>
<body>
      <script>
        let fruits=["Apple","Banana","Cherry","Date","Fig"];
        fruits.splice(1,2,"Dragon fruit","mango");
        document.write(fruits,"<br>");
    </script>
</body>
</html>
