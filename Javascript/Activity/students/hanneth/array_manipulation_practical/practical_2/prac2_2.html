<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.Add two fruits to the beginning of the array.</title>
</head>
<body>
    <script>
        let fruits=["Apple","Banana","Cherry","Date","Fig"];
        document.write(fruits,"<br>");
        document.write("After addition <br> ");
        fruits.unshift("Grape fruit","Dragon fruit");
        document.write(fruits,"<br>");
    </script>
</body>
</html>
