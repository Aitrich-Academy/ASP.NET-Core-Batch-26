<!DOCTYPE html>

<body>
    <h1>
        12.	Sort this array in ascending order:
        let nums = [20, 5, 100, 10];
    </h1>
    <script>
        let nums = [20, 5, 100, 10];
        nums.sort(function(a,b)
    {
        return a-b;
    });
        document.write(nums);
    </script>
</body>
