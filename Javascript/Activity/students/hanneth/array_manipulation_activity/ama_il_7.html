<body>
    <h1>
        7.	You have an array ["pen", "pencil", "scale", "eraser"].
         Check whether "sharpener" is included or not, and if not, add it to the end.
    </h1>
    <script>
        let array= ["pen", "pencil", "scale", "eraser"];
      let a=  array.includes("Sharpener");
      if(a==false)
      {
        array.push("Sharpener");
      }
      document.write(array);
    </script>
</body>
