<body>
    <h1>6.	Reverse the array of characters ["a", "b", "c", "d"] and then add
         "z" at the start of the reversed array.</h1>
         <script>
            let array=["a","b","c","d"];
            array.reverse();
            document.write("reversed array  ", array,"<br>");
            array.push("z");
            document.write("Array after addition    ",array);
         </script>
</body>
</html>
