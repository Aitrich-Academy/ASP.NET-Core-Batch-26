<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>1.	You have a list of student names. Add a new student at the beginning and remove the last student from the array.</h1>
    <script>
        let names=["sharanya","Dhanya","Sajna","Fajna","Rajitha"];
        document.write(names,"<br>");
        names.unshift("Aneesh");
        document.write("<b>After adding student at the beginning</b><br>",names,"<br>");
        names.pop();
        document.write("<b>After removing last student</b><br>",names,"<br>");
    </script>
</body>
</html>
