<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>12.	Split the array [100, 200, 300, 400, 500, 600] into two equal parts using slice().</h1>
    <script>
        let array=[100, 200, 300, 400, 500, 600];
        let array1=array.slice(0,3);
        document.write(array1,"<br>");
        let array2=array.slice(3,6);
        document.write(array2,"<br>");
    </script>
</body>
</html>
