<body>
    <h1>10.	Take an array of five numbers. Remove the middle element and insert "deleted" in its place.</h1>
    <script>
        let array=[1,2,3,4,5];
        array.splice(2,0);
        array[2]="deleted";
        document.write(array);
    </script>
