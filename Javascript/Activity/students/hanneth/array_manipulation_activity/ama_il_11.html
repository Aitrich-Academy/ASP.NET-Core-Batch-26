<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>11.	You are given an array of strings: ["login", "signup", "dashboard", "logout"].
         Find the index of "dashboard" and remove it.</h1>
    <script>
        let array=["login", "signup", "dashboard", "logout"];
        let index=array.indexOf("dashboard");
        array.splice(index,1);
        document.write(array);
    </script>
</body>
</html>
