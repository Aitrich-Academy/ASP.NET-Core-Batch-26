<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>
        6.	Remove 2 elements starting from index 1 in this array:
        let numbers = [10, 20, 30, 40, 50];
    </h1>
    <script>
        let numbers = [10, 20, 30, 40, 50];
        numbers.splice(1,2);
        document.write(numbers);
    </script>
</body>
