<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        13.	Add "First" to the beginning and "Last" to the end of the array:
         ["Middle1", "Middle2"], then join the array into a single string separated by >.
    </h1>
    <script>
        let array= ["Middle1", "Middle2"];
        array.unshift("first");
        array.push("Last");
        document.write(array,"<br>");
       let a= array.join(">");
        document.write(a);
    </script>
</body>
</html>
