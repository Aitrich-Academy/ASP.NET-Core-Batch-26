<body>
    <h1>
        10.	Convert this array into a string separated by -:
        let fruits = ["Apple", "Banana", "Cherry"];
    </h1>
    <script>
        let fruits = ["Apple", "Banana", "Cherry"];
        let result=fruits.join("-");
        document.write(result);
    </script>
</body>
