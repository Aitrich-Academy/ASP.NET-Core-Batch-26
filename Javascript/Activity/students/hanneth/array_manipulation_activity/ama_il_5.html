<body>
    <h1>5.	Take the array ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] 
        and extract weekdays only using slice().</h1>
        <script>
            let array= ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] ;
            let weekdays=array.slice(1,6);
            document.write(weekdays);
        </script>
</body>
