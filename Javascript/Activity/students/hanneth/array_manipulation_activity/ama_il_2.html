<body>
    <h1>2.	Combine two arrays: one for boys and one for girls, and sort the combined list alphabetically.</h1>
    <script>
      let  boys=["Aboothwahir","Affan Ahmad","Ahil Zaman","Ayan Thameem"];
      let  girls=["Fathima Noora","Naiha Maryam","Amina","Hala Bathool"];
        let kids=boys.concat(girls);
        kids.sort();
        document.write(kids);
    </script>
