<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>4.	From this array ["Math", "English", "Science", "History"], 
        remove "English" and replace it with "Computer" using splice().</h1>
    <script>
        let  array =["Math", "English", "Science", "History"];
        array.splice(1, 1, "Computer");
        document.write(array,"<br>");
    </script>
</body>
</html>
