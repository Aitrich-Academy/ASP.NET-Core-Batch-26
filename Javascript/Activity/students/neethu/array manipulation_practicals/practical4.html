<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let colors1=["red", "green", "blue"];
        let colors2=["yellow", "pink", "purple"];
        let allcolors=colors1.concat(colors2);
        document.write("Whole array before reversing"+"<br>"+allcolors+"<br>");
        allcolors.reverse();
        document.write("Whole array after reversing"+"<br>"+allcolors+"<br>");
    </script>
</body>
</html>
