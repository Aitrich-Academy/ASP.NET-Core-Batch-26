<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let students=["Miya","Sajith","Neethu","Jithin"];
        let newstudent=prompt("Enter a student name to be added");  
        students.unshift(newstudent);
        document.write("New student list"+"<br>"+students+"<br>");
        students.pop();
        document.write("New student list after deletion"+"<br>"+students);
    </script>
</body>
</html>
