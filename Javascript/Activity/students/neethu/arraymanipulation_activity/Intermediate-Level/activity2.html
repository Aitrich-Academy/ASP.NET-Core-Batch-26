<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let boys=["Raju","Muhammed","Ruben","Jithin"];
        document.write("Boys name List"+"<br>"+boys+"<br>");
        
        let girls=["Isabel","Jeanell","Priya","Miya"];
        document.write("Girls name List"+"<br>"+girls+"<br>");
        let students=boys.concat(girls);
        document.write("Students name List"+"<br>"+students+"<br>");
        students.sort();
        document.write("Sorted Students name List"+"<br>"+students+"<br>");
    </script>
</body>
</html>
