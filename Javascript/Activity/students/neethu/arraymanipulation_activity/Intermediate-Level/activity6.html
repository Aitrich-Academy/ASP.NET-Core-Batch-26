<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let characters=["a", "b", "c", "d"];
        document.write("Array before reversing"+"<br>"+characters+"<br>");
        characters.reverse();
        document.write("Array after reversing"+"<br>"+characters+"<br>");
        characters.unshift("z");
        document.write("Array after adding new element"+"<br>"+characters+"<br>");
    </script>
</body>
</html>
