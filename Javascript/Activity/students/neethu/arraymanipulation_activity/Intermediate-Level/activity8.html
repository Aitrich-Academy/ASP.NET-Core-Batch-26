<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr1=[2, 4, 6] ;
        let arr2=[1, 3, 5];
        let c=arr1.concat(arr2);
        document.write("Array after merging"+"<br>"+c+"<br>");
        c.sort(function(a,b){
            return b-a;
        })
        document.write("Array after sorting in descending order"+"<br>"+c+"<br>");
    </script>
    
</body>
</html>
