<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let input=prompt("Enter 5 numbers seperated by comma");
        let numbers=input.split(",");
        document.write("Array before deletion"+"<br>"+numbers+"<br>");
        numbers.splice(2,1,"deleted");
        document.write("Array after deletion"+"<br>"+numbers+"<br>");

    </script>
</body>
</html>
